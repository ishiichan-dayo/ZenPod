[package]
name = "ipod-core"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
aes = "0.9.4"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
flate2 = "1.1.11"
fs4 = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
imagesize = "0.15.0"
lindera = { version = "6.0.0", features = ["embed-ipadic"] }
lofty = "0.25.5"
log = "0.4.34"
nusb = "0.2.7"
plist = "1.10.1"
quick-xml = "0.42.0"
rand = "0.10.3"
rusqlite = { version = "0.43.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.10.9"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
