[package]
name = "zenpod-app"
version = "0.1.0"
description = "ZenPod のユースケース (画面と Tauri に依存しない部分)"
license = "GPL-3.0-or-later"
edition = "2021"

[dependencies]
log = "0.4.34"
ipod-core = { path = "../ipod-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
